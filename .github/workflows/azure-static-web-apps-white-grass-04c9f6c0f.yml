name: Deploy Angular to Azure Static Web App

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-22.04

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Install dependencies
      - name: Install Dependencies
        run: npm install

      # Build Angular app
      - name: Build
        run: npm run build -- --configuration production

      # Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Deploy using Azure CLI
      - name: Deploy to Azure Static Web Apps
        run: |
          az staticwebapp upload \
            --name krushna-billing-app \
            --resource-group free-billing-api \
            --source dist/bill-management-app/browser
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GRASS_04C9F6C0F }}
