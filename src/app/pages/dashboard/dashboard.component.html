<div class="dashboard">
  <h2>Dashboard</h2>

  <!-- Primary action -->
  <div class="primary" routerLink="/app/billing" *ngIf="auth.canWrite">
    <div class="icon">🧾</div>
    <div>
      <h3>Create Bill</h3>
      <p>Generate a new customer bill</p>
    </div>
  </div>

  <!-- Other actions -->
  <div class="grid">
    <div class="tile" routerLink="/app/sell-orders">
      <div class="icon">📋</div>
      <div class="label">Sell Orders</div>
    </div>

    <div class="tile" routerLink="/app/purchase-orders">
      <div class="icon">🛒</div>
      <div class="label">Purchase Orders</div>
    </div>

    <div class="tile" routerLink="/app/stock-book">
      <div class="icon">📦</div>
      <div class="label">Stock Book</div>
    </div>

    <div class="tile" routerLink="/app/account-book">
      <div class="icon">💰</div>
      <div class="label">Account Book</div>
    </div>

    <div class="tile" routerLink="/app/lending-book">
      <div class="icon">🤝</div>
      <div class="label">Lending Book</div>
    </div>

    <div class="tile" routerLink="/app/other-expenses">
      <div class="icon">🧮</div>
      <div class="label">Other Expenses</div>
    </div>
  </div>
</div>
