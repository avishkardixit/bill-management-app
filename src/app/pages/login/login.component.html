<div class="login-wrapper">
  <mat-card class="login-card">

    <h1 class="title">Bill Manager</h1>
    <p class="subtitle">Login to continue</p>

    <!-- ✅ FORM ADDED -->
    <form (ngSubmit)="login()">

      <mat-form-field appearance="outline" class="full">
        <mat-label>Username</mat-label>
        <input matInput required [(ngModel)]="email" name="email" />
        <mat-error *ngIf="submitted && !email.trim()">Username is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <input matInput required type="password" [(ngModel)]="password" name="password" />
        <mat-error *ngIf="submitted && !password">Password is required</mat-error>
      </mat-form-field>

      <!-- ✅ type="submit" -->
      <button
        mat-raised-button
        color="primary"
        class="full"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

  </mat-card>
</div>
